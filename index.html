<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>BaRCO Report Generator</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #e5e7eb;
  color: #111827;
}

.page {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,.08);
  padding: 24px;
}

.status {
  display: block;
  padding: 14px;
  margin-bottom: 18px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
}

.loading {
  background: #dbeafe;
  color: #1e40af;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.annex {
  text-align: right;
  font-size: 14px;
  font-style: italic;
  font-weight: bold;
  margin-bottom: 4px;
}

.header {
  text-align: center;
  margin-bottom: 22px;
}

.barangay {
  font-size: 16px;
  font-weight: bold;
}

.title {
  margin-top: 3px;
  font-size: 20px;
  font-weight: bold;
}

.subtitle {
  margin-top: 3px;
  font-size: 14px;
  font-weight: bold;
}

.reference {
  margin-top: 7px;
  font-size: 10px;
  font-style: italic;
  line-height: 1.5;
}

.slogan {
  margin-top: 6px;
  font-size: 11px;
  font-style: italic;
}

.report-id {
  margin-top: 12px;
  color: #1f4e78;
  font-size: 14px;
  font-weight: bold;
}

.section {
  margin-top: 18px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  overflow: hidden;
}

.section-title {
  padding: 10px 14px;
  background: #1f4e78;
  color: #ffffff;
  font-size: 14px;
  font-weight: bold;
}

.section-body {
  padding: 14px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.field label {
  display: block;
  margin-bottom: 5px;
  font-size: 11px;
  font-weight: bold;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  padding: 9px 10px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  background: #ffffff;
  color: #111827;
  font-family: Arial, sans-serif;
  font-size: 13px;
}

.field input[readonly] {
  background: #f8fafc;
}

.road-wrapper {
  width: 100%;
  overflow-x: auto;
}

.road-table {
  width: 100%;
  min-width: 1050px;
  border-collapse: collapse;
  table-layout: fixed;
}

.road-table th,
.road-table td {
  padding: 6px;
  border: 1px solid #9ca3af;
  vertical-align: top;
}

.road-table th {
  background: #eef2f7;
  text-align: center;
  font-size: 10px;
}

.road-table input,
.road-table select,
.road-table textarea {
  width: 100%;
  padding: 7px;
  border: 1px solid #d1d5db;
  border-radius: 5px;
  font-family: Arial, sans-serif;
  font-size: 12px;
}

.road-table textarea {
  min-height: 52px;
  resize: vertical;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 15px;
}

button {
  border: 0;
  border-radius: 7px;
  padding: 10px 16px;
  font-family: Arial, sans-serif;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.btn-green {
  background: #198754;
  color: #ffffff;
}

.btn-red {
  padding: 7px 10px;
  background: #dc3545;
  color: #ffffff;
}

.total {
  margin-top: 15px;
  text-align: right;
  font-size: 14px;
  font-weight: bold;
}

.save-area {
  display: flex;
  justify-content: flex-end;
  margin-top: 22px;
}

.save-button {
  min-width: 150px;
  padding: 13px 24px;
  background: #198754;
  color: #ffffff;
  font-size: 14px;
}

@media(max-width:700px) {

  body {
    padding: 8px;
  }

  .page {
    padding: 14px;
    border-radius: 8px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .title {
    font-size: 18px;
  }

}

</style>

</head>


<body>

<div class="page">

  <div
    id="statusBox"
    class="status loading"
  >
    Connecting to BaRCO backend...
  </div>


  <div
    id="app"
    style="display:none;"
  >

    <div
      id="annex"
      class="annex"
    ></div>


    <div class="header">

      <div
        id="barangay"
        class="barangay"
      ></div>

      <div
        id="reportTitle"
        class="title"
      ></div>

      <div
        id="reportSubtitle"
        class="subtitle"
      ></div>

      <div
        id="dilgReference"
        class="reference"
      ></div>

      <div
        id="slogan"
        class="slogan"
      ></div>


      <div class="report-id">

        Report ID:

        <span id="reportId">
          -
        </span>

      </div>

    </div>


    <!-- ===================================================
         REPORT INFORMATION
    ==================================================== -->

    <div class="section">

      <div class="section-title">
        Report Information
      </div>


      <div class="section-body">

        <div class="grid">


          <div class="field">

            <label>
              Month
            </label>

            <select id="month">

              <option value="January">
                January
              </option>

              <option value="February">
                February
              </option>

              <option value="March">
                March
              </option>

              <option value="April">
                April
              </option>

              <option value="May">
                May
              </option>

              <option value="June">
                June
              </option>

              <option value="July">
                July
              </option>

              <option value="August">
                August
              </option>

              <option value="September">
                September
              </option>

              <option value="October">
                October
              </option>

              <option value="November">
                November
              </option>

              <option value="December">
                December
              </option>

            </select>

          </div>


          <div class="field">

            <label>
              Year
            </label>

            <input
              id="year"
              type="number"
              min="2000"
              max="2100"
            >

          </div>


          <div class="field">

            <label>
              Date of BaRCO
            </label>

            <input
              id="dateOfBarco"
              type="date"
              onchange="syncRoadDates()"
            >

          </div>


          <div class="field">

            <label>
              Report Status
            </label>

            <input
              id="reportStatus"
              type="text"
              value="DRAFT"
              readonly
            >

          </div>


          <div class="field">

            <label>
              Prepared By
            </label>

            <input
              id="preparedBy"
              type="text"
            >

          </div>


          <div class="field">

            <label>
              Punong Barangay
            </label>

            <input
              id="punongBarangay"
              type="text"
            >

          </div>


        </div>

      </div>

    </div>


    <!-- ===================================================
         ROAD ENTRIES
    ==================================================== -->

    <div class="section">

      <div class="section-title">
        Barangay Road Clearing Entries
      </div>


      <div class="section-body">


        <div class="road-wrapper">

          <table class="road-table">

            <thead>

              <tr>

                <th style="width:80px;">
                  YES / NO
                </th>

                <th style="width:240px;">
                  Road / Street / Alley /
                  Turned Over Road
                </th>

                <th style="width:100px;">
                  Length (km)
                </th>

                <th style="width:140px;">
                  Date of Clearing
                </th>

                <th style="width:260px;">
                  Action Taken
                </th>

                <th style="width:210px;">
                  Remarks / MOV
                </th>

                <th style="width:70px;">
                  Remove
                </th>

              </tr>

            </thead>


            <tbody id="roadRows">
            </tbody>

          </table>

        </div>


        <div class="actions">

          <button
            type="button"
            class="btn-green"
            onclick="addRoadRow()"
          >
            + Add Road
          </button>

        </div>


        <div class="total">

          Total Road Length:

          <span id="totalRoadLength">
            0.00
          </span>

          km

        </div>

      </div>

    </div>


    <div class="save-area">

      <button
        id="saveButton"
        type="button"
        class="save-button"
        onclick="saveDraft()"
      >
        Save Draft
      </button>

    </div>

  </div>

</div>


<script>

/************************************************************
 * BaRCO REPORT GENERATOR
 * GitHub Pages Frontend
 * Apps Script iframe bridge version
 ************************************************************/


/* =========================================================
   APPS SCRIPT DEPLOYMENT URL
========================================================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbw4DOyLUBLe_RLsx6e-dK_52FLUMNhhWHmq4R9C2ViHpWwclJnMiQgPkA5h1lmaCKpe/exec';


/* =========================================================
   BRIDGE STATE
========================================================= */

let barcoBridgeFrame =
  null;

let barcoBridgeWindow =
  null;

let barcoBridgeReady =
  false;

let barcoBridgeReadyPromise =
  null;

const barcoBridgeWaiters =
  {};


/* =========================================================
   RECEIVE MESSAGES FROM APPS SCRIPT
========================================================= */

window.addEventListener(
  'message',
  function(ev) {

    const m =
      ev.data || {};


    /* -----------------------------------------------------
       BRIDGE READY
    ----------------------------------------------------- */

    if (
      m.__barcoBridgeReady === true
    ) {

      console.log(
        '[BaRCO CLIENT] READY FROM:',
        ev.origin
      );


      /*
       * IMPORTANT:
       *
       * Apps Script HtmlService may be inside a
       * nested googleusercontent frame.
       *
       * Save the exact window that sent READY.
       */
      barcoBridgeWindow =
        ev.source;


      barcoBridgeReady =
        true;


      window.dispatchEvent(
        new Event(
          'barco-bridge-ready'
        )
      );


      return;

    }


    /* -----------------------------------------------------
       API RESPONSE
    ----------------------------------------------------- */

    if (
      m.__barcoApi !== true ||
      !m.id
    ) {

      return;

    }


    console.log(
      '[BaRCO CLIENT] RESPONSE:',
      m.id,
      m.ok
    );


    const pending =
      barcoBridgeWaiters[
        m.id
      ];


    if (
      !pending
    ) {

      return;

    }


    delete barcoBridgeWaiters[
      m.id
    ];


    clearTimeout(
      pending.timer
    );


    if (
      m.ok
    ) {

      pending.resolve(
        m.data === undefined ||
        m.data === null
          ? {}
          : m.data
      );

    } else {

      pending.reject(
        new Error(
          m.error ||
          'BaRCO request failed.'
        )
      );

    }

  }
);


/* =========================================================
   PROBE BRIDGE
========================================================= */

function probeBarcoBridge() {

  if (
    !barcoBridgeFrame ||
    !barcoBridgeFrame.contentWindow
  ) {

    return;

  }


  try {

    barcoBridgeFrame
      .contentWindow
      .postMessage(
        {
          __barcoBridgeProbe:
            true
        },
        '*'
      );


    console.log(
      '[BaRCO CLIENT] PROBE SENT'
    );

  } catch(error) {

    console.warn(
      '[BaRCO CLIENT] PROBE ERROR',
      error
    );

  }

}


/* =========================================================
   CREATE / ENSURE BRIDGE
========================================================= */

function ensureBarcoBridge() {

  if (
    barcoBridgeReady &&
    barcoBridgeWindow
  ) {

    return Promise.resolve();

  }


  if (
    barcoBridgeReadyPromise
  ) {

    return barcoBridgeReadyPromise;

  }


  barcoBridgeReadyPromise =
    new Promise(
      function(
        resolve,
        reject
      ) {

        let settled =
          false;

        let probeTimer =
          null;

        let timeoutTimer =
          null;


        function cleanupReadyListener() {

          window.removeEventListener(
            'barco-bridge-ready',
            finishReady
          );

        }


        function finishReady() {

          if (
            settled
          ) {

            return;

          }


          if (
            !barcoBridgeReady ||
            !barcoBridgeWindow
          ) {

            return;

          }


          settled =
            true;


          if (
            probeTimer
          ) {

            clearInterval(
              probeTimer
            );

          }


          if (
            timeoutTimer
          ) {

            clearTimeout(
              timeoutTimer
            );

          }


          cleanupReadyListener();


          console.log(
            '[BaRCO CLIENT] BRIDGE CONNECTED'
          );


          resolve();

        }


        function failReady() {

          if (
            settled
          ) {

            return;

          }


          settled =
            true;


          if (
            probeTimer
          ) {

            clearInterval(
              probeTimer
            );

          }


          cleanupReadyListener();


          barcoBridgeReadyPromise =
            null;


          reject(
            new Error(
              'BaRCO bridge did not become ready.'
            )
          );

        }


        window.addEventListener(
          'barco-bridge-ready',
          finishReady
        );


        /* -------------------------------------------------
           CREATE HIDDEN APPS SCRIPT IFRAME
        ------------------------------------------------- */

        if (
          !barcoBridgeFrame
        ) {

          barcoBridgeFrame =
            document.createElement(
              'iframe'
            );


          barcoBridgeFrame.id =
            'barcoApiBridge';


          barcoBridgeFrame
            .setAttribute(
              'aria-hidden',
              'true'
            );


          barcoBridgeFrame.style.position =
            'fixed';

          barcoBridgeFrame.style.width =
            '1px';

          barcoBridgeFrame.style.height =
            '1px';

          barcoBridgeFrame.style.opacity =
            '0';

          barcoBridgeFrame.style.pointerEvents =
            'none';

          barcoBridgeFrame.style.border =
            '0';

          barcoBridgeFrame.style.left =
            '-9999px';

          barcoBridgeFrame.style.top =
            '-9999px';


          /*
           * Cache-buster.
           *
           * Ensures latest deployed Apps Script bridge
           * is loaded instead of a previously cached page.
           */
          const separator =
            API_URL.indexOf('?') >= 0
              ? '&'
              : '?';


          barcoBridgeFrame.src =
            API_URL +
            separator +
            'barco_bridge=1&v=' +
            encodeURIComponent(
              String(
                Date.now()
              )
            );


          barcoBridgeFrame
            .addEventListener(
              'load',
              function() {

                console.log(
                  '[BaRCO CLIENT] IFRAME LOADED'
                );


                probeBarcoBridge();


                setTimeout(
                  probeBarcoBridge,
                  300
                );


                setTimeout(
                  probeBarcoBridge,
                  1000
                );


                setTimeout(
                  probeBarcoBridge,
                  2500
                );

              }
            );


          document.body
            .appendChild(
              barcoBridgeFrame
            );

        }


        /*
         * Probe immediately.
         */
        probeBarcoBridge();


        /*
         * Continue probing until READY arrives.
         */
        probeTimer =
          setInterval(
            function() {

              if (
                barcoBridgeReady &&
                barcoBridgeWindow
              ) {

                finishReady();

                return;

              }


              probeBarcoBridge();

            },
            1000
          );


        /*
         * Maximum bridge startup wait.
         */
        timeoutTimer =
          setTimeout(
            failReady,
            30000
          );


        /*
         * READY may already have arrived
         * before timers were installed.
         */
        finishReady();

      }
    );


  return barcoBridgeReadyPromise;

}


/* =========================================================
   SEND API REQUEST THROUGH EXACT BRIDGE WINDOW
========================================================= */

function barcoApi(
  action,
  payload
) {

  payload =
    payload || {};


  return ensureBarcoBridge()
    .then(
      function() {

        return new Promise(
          function(
            resolve,
            reject
          ) {

            const id =
              'BARCO-BRIDGE-' +
              Date.now() +
              '-' +
              Math.random()
                .toString(36)
                .substring(
                  2,
                  8
                )
                .toUpperCase();


            const timer =
              setTimeout(
                function() {

                  delete barcoBridgeWaiters[
                    id
                  ];


                  reject(
                    new Error(
                      'BaRCO backend request timed out.'
                    )
                  );

                },
                30000
              );


            barcoBridgeWaiters[
              id
            ] = {

              resolve:
                resolve,

              reject:
                reject,

              timer:
                timer

            };


            try {

              if (
                !barcoBridgeWindow
              ) {

                throw new Error(
                  'BaRCO bridge window is unavailable.'
                );

              }


              console.log(
                '[BaRCO CLIENT] REQUEST SENT:',
                action,
                id
              );


              /*
               * CRITICAL:
               *
               * Send the request to the exact nested
               * Apps Script window that sent READY.
               */
              barcoBridgeWindow
                .postMessage(
                  {

                    __barcoApiRequest:
                      true,

                    id:
                      id,

                    action:
                      action,

                    payload:
                      payload

                  },
                  '*'
                );


            } catch(error) {

              clearTimeout(
                timer
              );


              delete barcoBridgeWaiters[
                id
              ];


              reject(
                error
              );

            }

          }
        );

      }
    );

}


/* =========================================================
   INITIALIZE BaRCO
========================================================= */

window.addEventListener(
  'load',
  async function() {

    const statusBox =
      document.getElementById(
        'statusBox'
      );


    try {

      console.log(
        '[BaRCO CLIENT] STARTING'
      );


      await ensureBarcoBridge();


      console.log(
        '[BaRCO CLIENT] CALLING INIT'
      );


      const data =
        await barcoApi(
          'init',
          {}
        );


      console.log(
        '[BaRCO CLIENT] INIT RESULT:',
        data
      );


      if (
        !data ||
        !data.success
      ) {

        throw new Error(
          data &&
          data.error
            ? data.error
            : 'Unable to load BaRCO data.'
        );

      }


      renderForm(
        data
      );


      if (
        document.querySelectorAll(
          '#roadRows tr'
        ).length === 0
      ) {

        addRoadRow();

      }


      document
        .getElementById(
          'app'
        )
        .style.display =
        'block';


      statusBox.className =
        'status success';


      statusBox.textContent =
        'BaRCO system ready.';


      setTimeout(
        function() {

          statusBox.style.display =
            'none';

        },
        1200
      );


    } catch(error) {

      console.error(
        '[BaRCO CLIENT] INIT ERROR:',
        error
      );


      statusBox.style.display =
        'block';


      statusBox.className =
        'status error';


      statusBox.textContent =
        'Connection error: ' +
        error.message;

    }

  }
);


/* =========================================================
   RENDER FORM
========================================================= */

function renderForm(
  data
) {

  document
    .getElementById(
      'annex'
    )
    .textContent =
    data.header &&
    data.header.annexLabel
      ? data.header.annexLabel
      : '';


  document
    .getElementById(
      'barangay'
    )
    .textContent =
    [
      data.header.barangayName,
      data.header.municipality,
      data.header.province
    ]
      .filter(Boolean)
      .join(', ');


  document
    .getElementById(
      'reportTitle'
    )
    .textContent =
    data.header.reportTitle ||
    '';


  document
    .getElementById(
      'reportSubtitle'
    )
    .textContent =
    data.header.reportSubtitle ||
    '';


  document
    .getElementById(
      'dilgReference'
    )
    .textContent =
    data.header.dilgReference ||
    '';


  document
    .getElementById(
      'slogan'
    )
    .textContent =
    data.header.slogan ||
    '';


  document
    .getElementById(
      'reportId'
    )
    .textContent =
    data.reportId ||
    '';


  document
    .getElementById(
      'preparedBy'
    )
    .value =
    data.report &&
    data.report.preparedBy
      ? data.report.preparedBy
      : '';


  document
    .getElementById(
      'punongBarangay'
    )
    .value =
    data.report &&
    data.report.punongBarangay
      ? data.report.punongBarangay
      : '';


  const now =
    new Date();


  document
    .getElementById(
      'month'
    )
    .value =
    now.toLocaleString(
      'en-US',
      {
        month:
          'long'
      }
    );


  document
    .getElementById(
      'year'
    )
    .value =
    now.getFullYear();


  document
    .getElementById(
      'dateOfBarco'
    )
    .value =
    formatDateForInput(
      now
    );


  document
    .getElementById(
      'reportStatus'
    )
    .value =
    'DRAFT';

}


/* =========================================================
   ADD ROAD ROW
========================================================= */

function addRoadRow() {

  const tbody =
    document.getElementById(
      'roadRows'
    );


  const tr =
    document.createElement(
      'tr'
    );


  const defaultDate =
    document
      .getElementById(
        'dateOfBarco'
      )
      .value || '';


  tr.innerHTML = `

    <td>

      <select class="conducted">

        <option value="YES">
          YES
        </option>

        <option value="NO">
          NO
        </option>

      </select>

    </td>


    <td>

      <input
        type="text"
        class="roadName"
        placeholder="Example: Puro – Burak Barangay Road"
      >

    </td>


    <td>

      <input
        type="number"
        class="roadLength"
        min="0"
        step="0.01"
        value="0"
        oninput="computeRoadTotal()"
      >

    </td>


    <td>

      <input
        type="date"
        class="clearingDate"
        value="${defaultDate}"
      >

    </td>


    <td>

      <textarea
        class="actionTaken"
        placeholder="Action taken"
      ></textarea>

    </td>


    <td>

      <textarea
        class="remarks"
      >Photo Documentation</textarea>

    </td>


    <td style="text-align:center;">

      <button
        type="button"
        class="btn-red"
        onclick="removeRoadRow(this)"
        title="Remove road"
      >
        ×
      </button>

    </td>

  `;


  tbody.appendChild(
    tr
  );


  computeRoadTotal();

}


/* =========================================================
   REMOVE ROAD ROW
========================================================= */

function removeRoadRow(
  button
) {

  const rows =
    document.querySelectorAll(
      '#roadRows tr'
    );


  if (
    rows.length <= 1
  ) {

    alert(
      'At least one road entry is required.'
    );

    return;

  }


  const row =
    button.closest(
      'tr'
    );


  if (
    row
  ) {

    row.remove();

  }


  computeRoadTotal();

}


/* =========================================================
   SYNC ROAD DATES
========================================================= */

function syncRoadDates() {

  const date =
    document
      .getElementById(
        'dateOfBarco'
      )
      .value;


  document
    .querySelectorAll(
      '.clearingDate'
    )
    .forEach(
      function(input) {

        input.value =
          date;

      }
    );

}


/* =========================================================
   COMPUTE ROAD TOTAL
========================================================= */

function computeRoadTotal() {

  let total =
    0;


  document
    .querySelectorAll(
      '.roadLength'
    )
    .forEach(
      function(input) {

        const value =
          Number(
            input.value || 0
          );


        if (
          Number.isFinite(
            value
          )
        ) {

          total +=
            value;

        }

      }
    );


  document
    .getElementById(
      'totalRoadLength'
    )
    .textContent =
    total.toFixed(
      2
    );

}


/* =========================================================
   COLLECT ROAD DATA
========================================================= */

function collectRoads() {

  const roads =
    [];


  document
    .querySelectorAll(
      '#roadRows tr'
    )
    .forEach(
      function(
        row
      ) {

        roads.push({

          conducted:
            row
              .querySelector(
                '.conducted'
              )
              .value,

          roadName:
            row
              .querySelector(
                '.roadName'
              )
              .value
              .trim(),

          roadLength:
            Number(
              row
                .querySelector(
                  '.roadLength'
                )
                .value || 0
            ),

          clearingDate:
            row
              .querySelector(
                '.clearingDate'
              )
              .value,

          actionTaken:
            row
              .querySelector(
                '.actionTaken'
              )
              .value
              .trim(),

          remarks:
            row
              .querySelector(
                '.remarks'
              )
              .value
              .trim()

        });

      }
    );


  return roads;

}


/* =========================================================
   SAVE DRAFT
========================================================= */

async function saveDraft() {

  const saveButton =
    document.getElementById(
      'saveButton'
    );


  const roads =
    collectRoads();


  const month =
    document
      .getElementById(
        'month'
      )
      .value;


  const year =
    Number(
      document
        .getElementById(
          'year'
        )
        .value
    );


  const dateOfBarco =
    document
      .getElementById(
        'dateOfBarco'
      )
      .value;


  if (
    !month
  ) {

    alert(
      'Please select the report month.'
    );

    return;

  }


  if (
    !year
  ) {

    alert(
      'Please enter the report year.'
    );

    return;

  }


  if (
    !dateOfBarco
  ) {

    alert(
      'Please select Date of BaRCO.'
    );

    return;

  }


  if (
    roads.length === 0
  ) {

    alert(
      'Please add at least one road.'
    );

    return;

  }


  for (
    let i = 0;
    i < roads.length;
    i++
  ) {

    if (
      !roads[i].roadName
    ) {

      alert(
        'Please enter the road name for Road #' +
        (i + 1) +
        '.'
      );

      return;

    }


    if (
      !roads[i].clearingDate
    ) {

      alert(
        'Please select the clearing date for Road #' +
        (i + 1) +
        '.'
      );

      return;

    }

  }


  const payload = {

    reportId:
      document
        .getElementById(
          'reportId'
        )
        .textContent
        .trim(),

    month:
      month,

    year:
      year,

    dateOfBarco:
      dateOfBarco,

    preparedBy:
      document
        .getElementById(
          'preparedBy'
        )
        .value
        .trim(),

    punongBarangay:
      document
        .getElementById(
          'punongBarangay'
        )
        .value
        .trim(),

    roads:
      roads

  };


  saveButton.disabled =
    true;


  saveButton.textContent =
    'Saving...';


  showStatus(
    'loading',
    'Saving draft...'
  );


  try {

    console.log(
      '[BaRCO CLIENT] SAVING:',
      payload
    );


    const result =
      await barcoApi(
        'saveDraft',
        payload
      );


    console.log(
      '[BaRCO CLIENT] SAVE RESULT:',
      result
    );


    if (
      !result ||
      !result.success
    ) {

      throw new Error(
        result &&
        result.error
          ? result.error
          : 'Unable to save draft.'
      );

    }


    if (
      result.reportId
    ) {

      document
        .getElementById(
          'reportId'
        )
        .textContent =
        result.reportId;

    }


    document
      .getElementById(
        'reportStatus'
      )
      .value =
      result.status ||
      'DRAFT';


    showStatus(
      'success',
      'Draft saved successfully. ' +
      Number(
        result.roadsSaved || 0
      ) +
      ' road entry/entries saved. ' +
      'Total road length: ' +
      Number(
        result.totalRoadLength || 0
      ).toFixed(2) +
      ' km.'
    );


  } catch(error) {

    console.error(
      '[BaRCO CLIENT] SAVE ERROR:',
      error
    );


    showStatus(
      'error',
      'Save error: ' +
      error.message
    );


  } finally {

    saveButton.disabled =
      false;


    saveButton.textContent =
      'Save Draft';

  }

}


/* =========================================================
   STATUS MESSAGE
========================================================= */

function showStatus(
  type,
  message
) {

  const box =
    document.getElementById(
      'statusBox'
    );


  box.style.display =
    'block';


  box.className =
    'status ' +
    type;


  box.textContent =
    message;


  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });

}


/* =========================================================
   FORMAT DATE FOR HTML INPUT
========================================================= */

function formatDateForInput(
  date
) {

  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() + 1
    )
      .padStart(
        2,
        '0'
      );


  const day =
    String(
      date.getDate()
    )
      .padStart(
        2,
        '0'
      );


  return (
    year +
    '-' +
    month +
    '-' +
    day
  );

}
