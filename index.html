<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>BaRCO Report Generator</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #e5e7eb;
  color: #111827;
}

.page {
  max-width: 1200px;
  margin: 0 auto;
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,.08);
  padding: 24px;
}

.status {
  padding: 14px;
  border-radius: 8px;
  margin-bottom: 18px;
  font-weight: bold;
}

.loading {
  background: #dbeafe;
  color: #1e40af;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.annex {
  text-align: right;
  font-weight: bold;
  font-style: italic;
}

.header {
  text-align: center;
  margin-bottom: 22px;
}

.barangay {
  font-weight: bold;
  font-size: 16px;
}

.title {
  font-weight: bold;
  font-size: 20px;
  margin-top: 4px;
}

.subtitle {
  font-weight: bold;
  margin-top: 3px;
}

.reference {
  margin-top: 4px;
  font-size: 11px;
  font-style: italic;
  line-height: 1.4;
}

.report-id {
  margin-top: 12px;
  color: #1f4e78;
  font-weight: bold;
}

.section {
  border: 1px solid #d1d5db;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 20px;
}

.section-title {
  background: #1f4e78;
  color: white;
  font-weight: bold;
  padding: 10px 14px;
}

.section-body {
  padding: 16px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 14px;
}

.field label {
  display: block;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 5px;
}

.field input,
.field select {
  width: 100%;
  padding: 10px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font: inherit;
}

.road-wrapper {
  overflow-x: auto;
}

.road-table {
  width: 100%;
  min-width: 1050px;
  border-collapse: collapse;
  table-layout: fixed;
}

.road-table th,
.road-table td {
  border: 1px solid #9ca3af;
  padding: 6px;
  vertical-align: top;
}

.road-table th {
  background: #eef2f7;
  font-size: 11px;
  text-align: center;
}

.road-table input,
.road-table select,
.road-table textarea {
  width: 100%;
  padding: 7px;
  border: 1px solid #d1d5db;
  border-radius: 5px;
  font-family: Arial, sans-serif;
  font-size: 12px;
}

.road-table textarea {
  min-height: 55px;
  resize: vertical;
}

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 15px;
}

button {
  border: 0;
  border-radius: 7px;
  padding: 10px 16px;
  cursor: pointer;
  font-weight: bold;
}

.btn-green {
  background: #198754;
  color: white;
}

.btn-red {
  background: #dc3545;
  color: white;
}

.total {
  margin-top: 15px;
  text-align: right;
  font-weight: bold;
  font-size: 15px;
}

.save-area {
  margin-top: 25px;
  display: flex;
  justify-content: flex-end;
}

.save-button {
  background: #198754;
  color: white;
  padding: 13px 28px;
  font-size: 15px;
}

.save-button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#barcoBridge {
  position: fixed;
  width: 1px;
  height: 1px;
  border: 0;
  opacity: 0;
  pointer-events: none;
}

@media(max-width:700px) {

  body {
    padding: 8px;
  }

  .page {
    padding: 14px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

}

</style>

</head>


<body>


<!--
  IMPORTANT:
  Replace src with your CURRENT Apps Script /exec URL.
-->

<iframe
  id="barcoBridge"
  src="https://script.google.com/macros/s/AKfycbw4DOyLUBLe_RLsx6e-dK_52FLUMNhhWHmq4R9C2ViHpWwclJnMiQgPkA5h1lmaCKpe/exec"
></iframe>


<div class="page">

  </div>


  <div

    <div

    </div>


    <div class="section">

              <option>April</option>
              <option>May</option>

              <option>July</option>

              <option>September</option>
              <option>October</option>

        </div>

    <div class="section">

      <div class="section-body">

          <table class="road-table">

            <thead>

              <tr>

                <th style="width:80px;">
                  YES / NO

                  Road / Street / Alley /

        <div class="total">

          km

      </div>

    </div>


    <div class="save-area">

        class="save-button"
        type="button"
        onclick="saveDraft()"
      >
        Save Draft
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   BRIDGE CONFIG
========================================================= */

const BARCO_BRIDGE_ORIGIN =
  'https://script.google.com';

let bridgeReady =
  false;

let requestCounter =
  0;

const pendingRequests =
  new Map();


/* =========================================================
   RECEIVE BRIDGE RESPONSES
========================================================= */

window.addEventListener(
  'message',
  function(event) {

    const data =
      event.data || {};


    if (
      data.__barcoBridgeReady === true
    ) {

      bridgeReady =
        true;

      console.log(
        '[BaRCO CLIENT] Bridge ready'
      );

      return;
    }


    if (
      data.__barcoApi !== true ||
      !data.id
    ) {

      return;
    }


    const pending =
      pendingRequests.get(
        data.id
      );


    if (!pending) {
      return;
    }


    pendingRequests.delete(
      data.id
    );


    clearTimeout(
      pending.timeout
    );


    if (data.ok) {

      pending.resolve(
        data.data
      );

    } else {

      pending.reject(
        new Error(
          data.error ||
          'BaRCO request failed.'
        )
      );

    }

  }
);


/* =========================================================
   CALL APPS SCRIPT THROUGH BRIDGE
========================================================= */

function barcoApi(
  action,
  payload
) {

  payload =
    payload || {};


  return new Promise(
    function(resolve, reject) {

      const id =
        'BARCO_REQ_' +
        Date.now() +
        '_' +
        (++requestCounter);


      const timeout =
        setTimeout(
          function() {

            pendingRequests.delete(
              id
            );

            reject(
              new Error(
                'BaRCO backend request timed out.'
              )
            );

          },
          30000
        );


      pendingRequests.set(
        id,
        {
          resolve:
            resolve,

          reject:
            reject,

          timeout:
            timeout
        }
      );


      const iframe =
        document.getElementById(
          'barcoBridge'
        );


      if (
        !iframe ||
        !iframe.contentWindow
      ) {

        clearTimeout(
          timeout
        );

        pendingRequests.delete(
          id
        );

        reject(
          new Error(
            'BaRCO bridge is not available.'
          )
        );

        return;
      }


      iframe.contentWindow
        .postMessage(
          {
            __barcoApiRequest:
              true,

            id:
              id,

            action:
              action,

            payload:
              payload
          },
          '*'
        );

    }
  );

}


/* =========================================================
   WAIT FOR BRIDGE
========================================================= */

async function waitForBridge() {

  const iframe =
    document.getElementById(
      'barcoBridge'
    );


  for (
    let i = 0;
    i < 40;
    i++
  ) {

    if (bridgeReady) {
      return true;
    }


    if (
      iframe &&
      iframe.contentWindow
    ) {

      iframe.contentWindow
        .postMessage(
          {
            __barcoBridgeProbe:
              true
          },
          '*'
        );

    }


    await sleep(250);

  }


  throw new Error(
    'BaRCO bridge did not become ready.'
  );

}


/* =========================================================
   BRIDGE CONFIG
========================================================= */

let barcoBridgeFrame = null;
let barcoBridgeWindow = null;
let barcoBridgeReady = false;
let barcoBridgeWaiters = {};
let barcoBridgeReadyPromise = null;


/* =========================================================
   RECEIVE MESSAGES FROM APPS SCRIPT BRIDGE
========================================================= */

window.addEventListener(
  'message',
  function(ev) {

    const m =
      ev.data || {};


    /* -------------------------------------------------------
       BRIDGE READY
    ------------------------------------------------------- */

    if (
      m.__barcoBridgeReady === true
    ) {

      console.log(
        '[BaRCO CLIENT] Bridge ready',
        ev.origin
      );


      /*
       * IMPORTANT:
       * Apps Script may run inside a nested
       * googleusercontent frame.
       *
       * Save the EXACT window that sent READY.
       */
      barcoBridgeWindow =
        ev.source;

      barcoBridgeReady =
        true;


      window.dispatchEvent(
        new Event(
          'barco-bridge-ready-internal'
        )
      );


      return;

    }


    /* -------------------------------------------------------
       API RESPONSE
    ------------------------------------------------------- */

    if (
      m.__barcoApi !== true ||
      !m.id
    ) {

      return;

    }


    const pending =
      barcoBridgeWaiters[
        m.id
      ];


    if (!pending) {
      return;
    }


    delete barcoBridgeWaiters[
      m.id
    ];


    clearTimeout(
      pending.timer
    );


    if (m.ok) {

      pending.resolve(
        m.data === undefined ||
        m.data === null
          ? {}
          : m.data
      );

    } else {

      pending.reject(
        new Error(
          m.error ||
          'BaRCO request failed.'
        )
      );

    }

  }
);


/* =========================================================
   ENSURE BRIDGE
========================================================= */

function ensureBarcoBridge() {

  if (
    barcoBridgeReady &&
    barcoBridgeWindow
  ) {

    return Promise.resolve();

  }


  if (
    barcoBridgeReadyPromise
  ) {

    return barcoBridgeReadyPromise;

  }


  barcoBridgeReadyPromise =
    new Promise(
      function(resolve, reject) {

        let settled =
          false;


        function finishReady() {

          if (settled) {
            return;
          }


          settled =
            true;


          clearTimeout(
            timer
          );


          barcoBridgeReady =
            true;


          resolve();

        }


        const timer =
          setTimeout(
            function() {

              if (settled) {
                return;
              }


              settled =
                true;


              barcoBridgeReadyPromise =
                null;


              reject(
                new Error(
                  'BaRCO bridge did not become ready.'
                )
              );

            },
            25000
          );


        if (
          !barcoBridgeFrame
        ) {

          barcoBridgeFrame =
            document.getElementById(
              'barcoBridge'
            );


          if (
            !barcoBridgeFrame
          ) {

            reject(
              new Error(
                'BaRCO bridge iframe not found.'
              )
            );

            return;

          }


          /*
           * Probe after iframe load.
           */
          barcoBridgeFrame
            .addEventListener(
              'load',
              function() {

                [
                  0,
                  300,
                  1000,
                  2500
                ].forEach(
                  function(delay) {

                    setTimeout(
                      function() {

                        if (
                          barcoBridgeReady
                        ) {
                          return;
                        }


                        try {

                          barcoBridgeFrame
                            .contentWindow
                            .postMessage(
                              {
                                __barcoBridgeProbe:
                                  true
                              },
                              '*'
                            );

                        } catch (err) {}

                      },
                      delay
                    );

                  }
                );

              }
            );

        }


        if (
          barcoBridgeReady &&
          barcoBridgeWindow
        ) {

          finishReady();

        }


        window.addEventListener(
          'barco-bridge-ready-internal',
          finishReady,
          {
            once:
              true
          }
        );

      }
    );


  return barcoBridgeReadyPromise;

}


/* =========================================================
   CALL APPS SCRIPT THROUGH EXACT BRIDGE WINDOW
========================================================= */

function barcoApi(
  action,
  payload
) {

  payload =
    payload || {};


  return ensureBarcoBridge()
    .then(
      function() {

        return new Promise(
          function(
            resolve,
            reject
          ) {

            const id =
              'BARCO-' +
              Date.now() +
              '-' +
              Math.random()
                .toString(36)
                .substring(
                  2,
                  8
                )
                .toUpperCase();


            const timer =
              setTimeout(
                function() {

                  delete barcoBridgeWaiters[
                    id
                  ];


                  reject(
                    new Error(
                      'BaRCO server request timed out.'
                    )
                  );

                },
                30000
              );


            barcoBridgeWaiters[
              id
            ] = {

              resolve:
                resolve,

              reject:
                reject,

              timer:
                timer

            };


            try {

              /*
               * CRITICAL FIX:
               * Send request back to the exact
               * googleusercontent window that
               * sent the READY message.
               */
              const bridgeTarget =
                barcoBridgeWindow;


              if (
                !bridgeTarget
              ) {

                throw new Error(
                  'BaRCO bridge window is unavailable.'
                );

              }


              bridgeTarget
                .postMessage(
                  {

                    __barcoApiRequest:
                      true,

                    id:
                      id,

                    action:
                      action,

                    payload:
                      payload

                  },
                  '*'
                );


              console.log(
                '[BaRCO CLIENT] Request sent:',
                action
              );


            } catch(error) {

              clearTimeout(
                timer
              );


              delete barcoBridgeWaiters[
                id
              ];


              reject(
                error
              );

            }

          }
        );

      }
    );

}

/* =========================================================
   ADD ROAD
========================================================= */

function addRoadRow() {

  const tbody =
    document.getElementById(
      'roadRows'
    );


  const tr =
    document.createElement(
      'tr'
    );


  const defaultDate =
    document
      .getElementById(
        'dateOfBarco'
      )
      .value;


  tr.innerHTML = `

    <td>

      <select class="conducted">

        <option value="YES">
          YES
        </option>

        <option value="NO">
          NO
        </option>

      </select>

    </td>


    <td>

      <input
        class="roadName"
        type="text"
        placeholder="Example: Puro – Burak Barangay Road"
      >

    </td>


    <td>

      <input
        class="roadLength"
        type="number"
        min="0"
        step="0.01"
        value="0"
        oninput="computeRoadTotal()"
      >

    </td>


    <td>

      <input
        class="clearingDate"
        type="date"
        value="${defaultDate}"
      >

    </td>


    <td>

      <textarea
        class="actionTaken"
        placeholder="Action taken"
      ></textarea>

    </td>


    <td>

      <textarea
        class="remarks"
      >Photo Documentation</textarea>

    </td>


    <td style="text-align:center;">

      <button
        type="button"
        class="btn-red"
        onclick="removeRoadRow(this)"
      >
        ×
      </button>

    </td>

  `;


  tbody.appendChild(
    tr
  );


  computeRoadTotal();

}


/* =========================================================
   REMOVE ROAD
========================================================= */

function removeRoadRow(
  button
) {

  const rows =
    document.querySelectorAll(
      '#roadRows tr'
    );


  if (
    rows.length <= 1
  ) {

    alert(
      'At least one road entry is required.'
    );

    return;

  }


  button
    .closest('tr')
    .remove();


  computeRoadTotal();

}


/* =========================================================
   TOTAL
========================================================= */

function computeRoadTotal() {

  let total = 0;


  document
    .querySelectorAll(
      '.roadLength'
    )
    .forEach(
      function(input) {

        total +=
          Number(
            input.value || 0
          );

      }
    );


  document
    .getElementById(
      'totalRoadLength'
    )
    .textContent =
    total.toFixed(2);

}


/* =========================================================
   COLLECT ROADS
========================================================= */

function collectRoads() {

  const roads = [];


  document
    .querySelectorAll(
      '#roadRows tr'
    )
    .forEach(
      function(row) {

        roads.push({

          conducted:
            row
              .querySelector(
                '.conducted'
              )
              .value,

          roadName:
            row
              .querySelector(
                '.roadName'
              )
              .value
              .trim(),

          roadLength:
            Number(
              row
                .querySelector(
                  '.roadLength'
                )
                .value || 0
            ),

          clearingDate:
            row
              .querySelector(
                '.clearingDate'
              )
              .value,

          actionTaken:
            row
              .querySelector(
                '.actionTaken'
              )
              .value
              .trim(),

          remarks:
            row
              .querySelector(
                '.remarks'
              )
              .value
              .trim()

        });

      }
    );


  return roads;

}


/* =========================================================
   SAVE DRAFT
========================================================= */

async function saveDraft() {

  const button =
    document.getElementById(
      'saveButton'
    );


  const roads =
    collectRoads();


  const dateOfBarco =
    document
      .getElementById(
        'dateOfBarco'
      )
      .value;


  if (!dateOfBarco) {

    alert(
      'Please select Date of BaRCO.'
    );

    return;

  }


  for (
    let i = 0;
    i < roads.length;
    i++
  ) {

    if (
      !roads[i].roadName
    ) {

      alert(
        'Please enter the road name for Road #' +
        (i + 1) +
        '.'
      );

      return;

    }


    if (
      !roads[i].clearingDate
    ) {

      alert(
        'Please select the clearing date for Road #' +
        (i + 1) +
        '.'
      );

      return;

    }

  }


  const payload = {

    reportId:
      document
        .getElementById(
          'reportId'
        )
        .textContent
        .trim(),

    month:
      document
        .getElementById(
          'month'
        )
        .value,

    year:
      Number(
        document
          .getElementById(
            'year'
          )
          .value
      ),

    dateOfBarco:
      dateOfBarco,

    preparedBy:
      document
        .getElementById(
          'preparedBy'
        )
        .value
        .trim(),

    punongBarangay:
      document
        .getElementById(
          'punongBarangay'
        )
        .value
        .trim(),

    roads:
      roads

  };


  button.disabled =
    true;


  button.textContent =
    'Saving...';


  showStatus(
    'loading',
    'Saving draft...'
  );


  try {

    const result =
      await barcoApi(
        'saveDraft',
        payload
      );


    button.disabled =
      false;


    button.textContent =
      'Save Draft';


    if (
      !result ||
      !result.success
    ) {

      throw new Error(
        result &&
        result.error
          ? result.error
          : 'Unable to save draft.'
      );

    }


    document
      .getElementById(
        'reportId'
      )
      .textContent =
      result.reportId;


    showStatus(
      'success',
      'Draft saved successfully. ' +
      result.roadsSaved +
      ' road entry/entries saved. ' +
      'Total road length: ' +
      Number(
        result.totalRoadLength
      ).toFixed(2) +
      ' km.'
    );


  } catch(error) {

    button.disabled =
      false;


    button.textContent =
      'Save Draft';


    showStatus(
      'error',
      'Save error: ' +
      error.message
    );

  }

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  type,
  message
) {

  const box =
    document.getElementById(
      'statusBox'
    );


  box.style.display =
    'block';


  box.className =
    'status ' +
    type;


  box.textContent =
    message;


  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });

}


/* =========================================================
   HELPERS

function sleep(ms) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        ms
      );

    }
  );

}


function formatDateForInput(
  date
) {

  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      '0'
    );


  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      '0'
    );


  return (
    year +
    '-' +
    month +
    '-' +
    day
  );

}
