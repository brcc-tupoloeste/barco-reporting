<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>BaRCO Report Generator</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #e5e7eb;
  color: #111827;
}

.page {
  max-width: 1200px;
  margin: 0 auto;
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,.08);
  padding: 24px;
}

.status {
  padding: 14px;
  border-radius: 8px;
  margin-bottom: 18px;
  font-weight: bold;
}

.loading {
  background: #dbeafe;
  color: #1e40af;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.annex {
  text-align: right;
  font-weight: bold;
  font-style: italic;
}

.header {
  text-align: center;
  margin-bottom: 22px;
}

.barangay {
  font-weight: bold;
  font-size: 16px;
}

.title {
  font-weight: bold;
  font-size: 20px;
  margin-top: 4px;
}

.subtitle {
  font-weight: bold;
  margin-top: 3px;
}

.reference {
  margin-top: 4px;
  font-size: 11px;
  font-style: italic;
  line-height: 1.4;
}

.report-id {
  margin-top: 12px;
  color: #1f4e78;
  font-weight: bold;
}

.section {
  border: 1px solid #d1d5db;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 20px;
}

.section-title {
  background: #1f4e78;
  color: white;
  font-weight: bold;
  padding: 10px 14px;
}

.section-body {
  padding: 16px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 14px;
}

.field label {
  display: block;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 5px;
}

.field input,
.field select {
  width: 100%;
  padding: 10px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font: inherit;
}

/* ROAD TABLE */

.road-wrapper {
  overflow-x: auto;
}

.road-table {
  width: 100%;
  min-width: 1050px;
  border-collapse: collapse;
  table-layout: fixed;
}

.road-table th,
.road-table td {
  border: 1px solid #9ca3af;
  padding: 6px;
  vertical-align: top;
}

.road-table th {
  background: #eef2f7;
  font-size: 11px;
  text-align: center;
}

.road-table input,
.road-table select,
.road-table textarea {
  width: 100%;
  padding: 7px;
  border: 1px solid #d1d5db;
  border-radius: 5px;
  font-family: Arial, sans-serif;
  font-size: 12px;
}

.road-table textarea {
  min-height: 55px;
  resize: vertical;
}

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 15px;
}

button {
  border: 0;
  border-radius: 7px;
  padding: 10px 16px;
  cursor: pointer;
  font-weight: bold;
}

.btn-green {
  background: #198754;
  color: white;
}

.btn-red {
  background: #dc3545;
  color: white;
}

.total {
  margin-top: 15px;
  text-align: right;
  font-weight: bold;
  font-size: 15px;
}

.save-area {
  margin-top: 25px;
  display: flex;
  justify-content: flex-end;
}

.save-button {
  background: #198754;
  color: white;
  padding: 13px 28px;
  font-size: 15px;
}

.save-button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

@media(max-width:700px) {

  body {
    padding: 8px;
  }

  .page {
    padding: 14px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

}

</style>

</head>

<body>

<div class="page">

  <div
    id="statusBox"
    class="status loading"
  >
    Connecting to BaRCO backend...
  </div>

  <div
    id="app"
    style="display:none;"
  >

    <div
      class="annex"
      id="annex"
    ></div>

    <div class="header">

      <div
        class="barangay"
        id="barangay"
      ></div>

      <div
        class="title"
        id="reportTitle"
      ></div>

      <div
        class="subtitle"
        id="reportSubtitle"
      ></div>

      <div
        class="reference"
        id="dilgReference"
      ></div>

      <div class="report-id">
        Report ID:
        <span id="reportId"></span>
      </div>

    </div>


    <!-- REPORT INFORMATION -->

    <div class="section">

      <div class="section-title">
        Report Information
      </div>

      <div class="section-body">

        <div class="grid">

          <div class="field">
            <label>Month</label>

            <select id="month">
              <option>January</option>
              <option>February</option>
              <option>March</option>
              <option>April</option>
              <option>May</option>
              <option>June</option>
              <option>July</option>
              <option>August</option>
              <option>September</option>
              <option>October</option>
              <option>November</option>
              <option>December</option>
            </select>
          </div>


          <div class="field">
            <label>Year</label>

            <input
              id="year"
              type="number"
            >
          </div>


          <div class="field">
            <label>Date of BaRCO</label>

            <input
              id="dateOfBarco"
              type="date"
              onchange="syncRoadDates()"
            >
          </div>


          <div class="field">
            <label>Report Status</label>

            <input
              id="reportStatus"
              value="DRAFT"
              readonly
            >
          </div>


          <div class="field">
            <label>Prepared By</label>

            <input
              id="preparedBy"
              type="text"
            >
          </div>


          <div class="field">
            <label>Punong Barangay</label>

            <input
              id="punongBarangay"
              type="text"
            >
          </div>

        </div>

      </div>

    </div>


    <!-- ROAD ENTRIES -->

    <div class="section">

      <div class="section-title">
        Barangay Road Clearing Entries
      </div>

      <div class="section-body">

        <div class="road-wrapper">

          <table class="road-table">

            <thead>

              <tr>

                <th style="width:80px;">
                  YES / NO
                </th>

                <th style="width:240px;">
                  Road / Street / Alley /
                  Turned Over Road
                </th>

                <th style="width:100px;">
                  Length (km)
                </th>

                <th style="width:140px;">
                  Date of Clearing
                </th>

                <th style="width:260px;">
                  Action Taken
                </th>

                <th style="width:210px;">
                  Remarks / MOV
                </th>

                <th style="width:70px;">
                  Remove
                </th>

              </tr>

            </thead>

            <tbody id="roadRows"></tbody>

          </table>

        </div>


        <div class="actions">

          <button
            type="button"
            class="btn-green"
            onclick="addRoadRow()"
          >
            + Add Road
          </button>

        </div>


        <div class="total">
          Total Road Length:
          <span id="totalRoadLength">
            0.00
          </span>
          km
        </div>

      </div>

    </div>


    <div class="save-area">

      <button
        id="saveButton"
        class="save-button"
        type="button"
        onclick="saveDraft()"
      >
        Save Draft
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   API URL
========================================================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbw4DOyLUBLe_RLsx6e-dK_52FLUMNhhWHmq4R9C2ViHpWwclJnMiQgPkA5h1lmaCKpe/exec';


/* =========================================================
   JSONP GET
========================================================= */

function apiGet(action, params) {

  params = params || {};

  return new Promise(function(resolve, reject) {

    const callbackName =
      'barcoCallback_' +
      Date.now() +
      '_' +
      Math.floor(Math.random() * 1000000);

    const script =
      document.createElement('script');

    let settled = false;


    /*
     * Register callback FIRST.
     */
    window[callbackName] = function(data) {

      if (settled) {
        return;
      }

      settled = true;

      clearTimeout(timeoutId);

      resolve(data);

      /*
       * Do not immediately delete the callback.
       * Keep a harmless no-op briefly in case
       * the browser/script redirect fires late.
       */
      window[callbackName] = function() {};

      setTimeout(function() {

        try {
          delete window[callbackName];
        } catch (e) {
          window[callbackName] = undefined;
        }

      }, 30000);


      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    };


    script.onerror = function() {

      if (settled) {
        return;
      }

      settled = true;

      clearTimeout(timeoutId);

      /*
       * Keep callback defined so a late
       * Apps Script redirect cannot throw
       * "callback is not defined".
       */
      window[callbackName] = function() {};

      reject(
        new Error(
          'Unable to connect to BaRCO backend.'
        )
      );

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    };


    let url =
      API_URL +
      '?action=' +
      encodeURIComponent(action) +
      '&callback=' +
      encodeURIComponent(callbackName) +
      '&_=' +
      Date.now();


    Object.keys(params).forEach(function(key) {

      url +=
        '&' +
        encodeURIComponent(key) +
        '=' +
        encodeURIComponent(
          String(params[key])
        );

    });


    script.src = url;

    script.async = true;


    /*
     * Apps Script sometimes redirects through
     * googleusercontent.com and private browsing
     * can delay that redirect substantially.
     *
     * 60 seconds is safer than the old 15 seconds.
     */
    const timeoutId =
      setTimeout(function() {

        if (settled) {
          return;
        }

        settled = true;

        /*
         * IMPORTANT:
         * Do NOT delete callback here.
         * Convert it to no-op so a late response
         * does not cause ReferenceError.
         */
        window[callbackName] =
          function() {};

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        reject(
          new Error(
            'BaRCO backend request timed out.'
          )
        );

      }, 60000);


    document.head.appendChild(script);

  });

}


/* =========================================================
   INITIALIZE APP
========================================================= */

window.addEventListener(
  'load',
  async function() {

    const statusBox =
      document.getElementById(
        'statusBox'
      );

    try {

      const ping =
        await apiGet('ping');


      if (
        !ping ||
        !ping.success
      ) {

        throw new Error(
          'Backend ping failed.'
        );

      }


      const data =
        await apiGet('init');


      if (
        !data ||
        !data.success
      ) {

        throw new Error(
          data &&
          data.error
            ? data.error
            : 'Unable to load BaRCO data.'
        );

      }


      renderForm(data);

      addRoadRow();


      document
        .getElementById('app')
        .style.display =
        'block';


      statusBox.className =
        'status success';

      statusBox.textContent =
        'BaRCO backend connected successfully.';


      setTimeout(
        function() {

          statusBox.style.display =
            'none';

        },
        2000
      );


    } catch(error) {

      console.error(
        'BaRCO initialization error:',
        error
      );

      statusBox.style.display =
        'block';

      statusBox.className =
        'status error';

      statusBox.textContent =
        'Connection error: ' +
        error.message;

    }

  }
);


/* =========================================================
   RENDER FORM
========================================================= */

function renderForm(data) {

  document
    .getElementById('annex')
    .textContent =
    data.header.annexLabel;


  document
    .getElementById('barangay')
    .textContent =
    data.header.barangayName +
    ', ' +
    data.header.municipality +
    ', ' +
    data.header.province;


  document
    .getElementById('reportTitle')
    .textContent =
    data.header.reportTitle;


  document
    .getElementById('reportSubtitle')
    .textContent =
    data.header.reportSubtitle;


  document
    .getElementById('dilgReference')
    .textContent =
    data.header.dilgReference;


  document
    .getElementById('reportId')
    .textContent =
    data.reportId;


  document
    .getElementById('preparedBy')
    .value =
    data.report.preparedBy;


  document
    .getElementById('punongBarangay')
    .value =
    data.report.punongBarangay;


  const now =
    new Date();


  const monthName =
    now.toLocaleString(
      'en-US',
      {
        month: 'long'
      }
    );


  document
    .getElementById('month')
    .value =
    monthName;


  document
    .getElementById('year')
    .value =
    now.getFullYear();


  document
    .getElementById('dateOfBarco')
    .value =
    formatDateForInput(now);

}


/* =========================================================
   ADD ROAD
========================================================= */

function addRoadRow() {

  const tbody =
    document.getElementById(
      'roadRows'
    );


  const tr =
    document.createElement(
      'tr'
    );


  const defaultDate =
    document
      .getElementById(
        'dateOfBarco'
      )
      .value;


  tr.innerHTML = `

    <td>

      <select class="conducted">

        <option value="YES">
          YES
        </option>

        <option value="NO">
          NO
        </option>

      </select>

    </td>


    <td>

      <input
        class="roadName"
        type="text"
        placeholder="Example: Puro – Burak Barangay Road"
      >

    </td>


    <td>

      <input
        class="roadLength"
        type="number"
        min="0"
        step="0.01"
        value="0"
        oninput="computeRoadTotal()"
      >

    </td>


    <td>

      <input
        class="clearingDate"
        type="date"
        value="${defaultDate}"
      >

    </td>


    <td>

      <textarea
        class="actionTaken"
        placeholder="Action taken"
      ></textarea>

    </td>


    <td>

      <textarea
        class="remarks"
      >Photo Documentation</textarea>

    </td>


    <td style="text-align:center;">

      <button
        type="button"
        class="btn-red"
        onclick="removeRoadRow(this)"
      >
        ×
      </button>

    </td>

  `;


  tbody.appendChild(
    tr
  );


  computeRoadTotal();

}


/* =========================================================
   REMOVE ROAD
========================================================= */

function removeRoadRow(button) {

  const rows =
    document.querySelectorAll(
      '#roadRows tr'
    );


  if (
    rows.length <= 1
  ) {

    alert(
      'At least one road entry is required.'
    );

    return;

  }


  button
    .closest('tr')
    .remove();


  computeRoadTotal();

}


/* =========================================================
   SYNC ROAD DATES
========================================================= */

function syncRoadDates() {

  const date =
    document
      .getElementById(
        'dateOfBarco'
      )
      .value;


  document
    .querySelectorAll(
      '.clearingDate'
    )
    .forEach(
      function(input) {

        if (
          !input.dataset.manuallyChanged
        ) {
          input.value = date;
        }

      }
    );

}


/* =========================================================
   TOTAL ROAD LENGTH
========================================================= */

function computeRoadTotal() {

  let total = 0;


  document
    .querySelectorAll(
      '.roadLength'
    )
    .forEach(
      function(input) {

        total +=
          Number(
            input.value || 0
          );

      }
    );


  document
    .getElementById(
      'totalRoadLength'
    )
    .textContent =
    total.toFixed(2);

}


/* =========================================================
   COLLECT ROADS
========================================================= */

function collectRoads() {

  const roads = [];


  document
    .querySelectorAll(
      '#roadRows tr'
    )
    .forEach(
      function(row) {

        roads.push({

          conducted:
            row
              .querySelector(
                '.conducted'
              )
              .value,

          roadName:
            row
              .querySelector(
                '.roadName'
              )
              .value
              .trim(),

          roadLength:
            Number(
              row
                .querySelector(
                  '.roadLength'
                )
                .value || 0
            ),

          clearingDate:
            row
              .querySelector(
                '.clearingDate'
              )
              .value,

          actionTaken:
            row
              .querySelector(
                '.actionTaken'
              )
              .value
              .trim(),

          remarks:
            row
              .querySelector(
                '.remarks'
              )
              .value
              .trim()

        });

      }
    );


  return roads;

}


/* =========================================================
   SAVE DRAFT
========================================================= */

async function saveDraft() {

  const button =
    document.getElementById(
      'saveButton'
    );


  const roads =
    collectRoads();


  const dateOfBarco =
    document
      .getElementById(
        'dateOfBarco'
      )
      .value;


  if (!dateOfBarco) {

    alert(
      'Please select Date of BaRCO.'
    );

    return;

  }


  for (
    let i = 0;
    i < roads.length;
    i++
  ) {

    if (!roads[i].roadName) {

      alert(
        'Please enter the road name for Road #' +
        (i + 1) +
        '.'
      );

      return;

    }


    if (!roads[i].clearingDate) {

      alert(
        'Please select the clearing date for Road #' +
        (i + 1) +
        '.'
      );

      return;

    }

  }


  const reportId =
    document
      .getElementById(
        'reportId'
      )
      .textContent
      .trim();


  const payload = {

    reportId:
      reportId,

    month:
      document
        .getElementById(
          'month'
        )
        .value,

    year:
      Number(
        document
          .getElementById(
            'year'
          )
          .value
      ),

    dateOfBarco:
      dateOfBarco,

    preparedBy:
      document
        .getElementById(
          'preparedBy'
        )
        .value
        .trim(),

    punongBarangay:
      document
        .getElementById(
          'punongBarangay'
        )
        .value
        .trim(),

    roads:
      roads

  };


  button.disabled =
    true;

  button.textContent =
    'Saving...';


  showStatus(
    'loading',
    'Saving draft...'
  );


  try {

    /*
     * POST the save request.
     *
     * no-cors means browser doesn't need
     * permission to read the POST response.
     */
    await fetch(
      API_URL,
      {
        method:
          'POST',

        mode:
          'no-cors',

        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body:
          JSON.stringify({
            action:
              'saveDraft',

            data:
              payload
          })
      }
    );


    /*
     * Wait briefly so Apps Script has
     * time to write to Sheets.
     */
    await sleep(1000);


    /*
     * Verify via working JSONP GET.
     */
    const result =
      await waitForSavedReport(
        reportId,
        roads.length
      );


    if (
      !result ||
      !result.found
    ) {

      throw new Error(
        'The report could not be confirmed after saving.'
      );

    }


    button.disabled =
      false;

    button.textContent =
      'Save Draft';


    showStatus(
      'success',
      'Draft saved successfully. ' +
      result.roadsSaved +
      ' road entry/entries saved. ' +
      'Total road length: ' +
      Number(
        result.totalRoadLength
      ).toFixed(2) +
      ' km.'
    );


  } catch(error) {

    console.error(
      'Save draft error:',
      error
    );


    button.disabled =
      false;

    button.textContent =
      'Save Draft';


    showStatus(
      'error',
      'Save error: ' +
      error.message
    );

  }

}

function sleep(ms) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        ms
      );

    }
  );

}


/*
 * Check repeatedly until the saved
 * report and expected road count appear.
 */
async function waitForSavedReport(
  reportId,
  expectedRoadCount
) {

  const maxAttempts =
    8;


  for (
    let attempt = 1;
    attempt <= maxAttempts;
    attempt++
  ) {

    const result =
      await apiGet(
        'getReport',
        {
          reportId:
            reportId
        }
      );


    if (
      result &&
      result.success &&
      result.found &&
      Number(
        result.roadsSaved
      ) ===
      Number(
        expectedRoadCount
      )
    ) {

      return result;

    }


    await sleep(
      1000
    );

  }


  throw new Error(
    'Save confirmation timed out.'
  );

}

  
/* =========================================================
   STATUS
========================================================= */

function showStatus(
  type,
  message
) {

  const box =
    document.getElementById(
      'statusBox'
    );


  box.style.display =
    'block';


  box.className =
    'status ' +
    type;


  box.textContent =
    message;


  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });

}


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDateForInput(
  date
) {

  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      '0'
    );


  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      '0'
    );


  return (
    year +
    '-' +
    month +
    '-' +
    day
  );

}

</script>

</body>

</html>
